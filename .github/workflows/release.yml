name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm OIDC Trusted Publishing

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so changesets can detect all changes

      - uses: pnpm/action-setup@v4
        # version omitted on purpose — resolved from the "packageManager"
        # field in root package.json; verify that field is set correctly

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # bump to 24+ if you rely on npm v11 OIDC locally too
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build all packages
        # Must build first because vitest's CSS imports reference
        # @mizu-ui/tokens/dist/light.css which only exists after build.
        run: pnpm -r build

      - name: Typecheck & test
        run: |
          pnpm --filter @mizu-ui/vue typecheck
          pnpm --filter @mizu-ui/vue test

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          # GitHub blocks using 'GITHUB_TOKEN' as a custom secret name, so
          # we store the PAT under 'MIZU' and re-expose it as GITHUB_TOKEN
          # here for the changesets action to consume.
          GITHUB_TOKEN: ${{ secrets.MIZU }}
